<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Martín - Log de Eventos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <nav class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-cyan-400 tracking-wider">🤖 PROYECTO MARTÍN</h1>
            <span class="bg-green-500 text-xs text-black font-semibold px-2 py-1 rounded-full animate-pulse">
                Servidor En Línea
            </span>
        </div>
    </nav>

    <main class="container mx-auto p-6 max-w-5xl">
        <header class="mb-6 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-semibold">Dashboard de Visualización</h2>
                <p class="text-gray-400 text-sm">Monitoreo de eventos en tiempo real para el asistente de laboratorio.</p>
            </div>
            <button onclick="cargarLogs()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium px-4 py-2 rounded shadow transition-all cursor-pointer">
                🔄 Actualizar
            </button>
        </header>

        <div class="bg-gray-800 rounded-lg shadow-xl border border-gray-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-700 text-gray-300 text-sm uppercase tracking-wider">
                            <th class="p-4">Timestamp</th>
                            <th class="p-4">Componente</th>
                            <th class="p-4">Tipo</th>
                            <th class="p-4">Descripción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-logs" class="divide-y divide-gray-700 text-sm">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-gray-500">Cargando logs del servidor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Función para consumir los logs desde el Backend
        async function cargarLogs() {
            try {
                // Buscamos la API en el mismo servidor (IP pública)
                const respuesta = await fetch('http://161.35.112.5:3000/api/logs');
                if (!respuesta.ok) throw new Error('Error al conectar con el backend');
                
                const logs = await respuesta.json();
                const tabla = document.getElementById('tabla-logs');
                
                if (logs.length === 0) {
                    tabla.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">No hay eventos registrados todavía.</td></tr>`;
                    return;
                }

                // Limpiamos la tabla e inyectamos las filas de datos
                tabla.innerHTML = '';
                logs.forEach(log => {
                    // Formatear la fecha
                    const fecha = new Date(log.timestamp).toLocaleString('es-GT');
                    
                    // Definir color según el tipo de acción
                    let badgeColor = 'bg-blue-900 text-blue-300';
                    if (log.tipo_accion === 'ERROR') badgeColor = 'bg-red-900 text-red-300';
                    if (log.tipo_accion === 'WARNING') badgeColor = 'bg-yellow-900 text-yellow-300';

                    tabla.innerHTML += `
                        <tr class="hover:bg-gray-750 transition-colors">
                            <td class="p-4 text-gray-400 whitespace-nowrap">${fecha}</td>
                            <td class="p-4 font-medium text-cyan-300">${log.componente}</td>
                            <td class="p-4">
                                <span class="px-2 py-1 rounded text-xs font-bold uppercase ${badgeColor}">
                                    ${log.tipo_accion}
                                </span>
                            </td>
                            <td class="p-4 text-gray-300">${log.descripcion}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error(error);
                document.getElementById('tabla-logs').innerHTML = `
                    <tr>
                        <td colspan="4" class="p-4 text-center text-red-400 font-medium">
                            ⚠️ Error al conectar con el Backend de Logs.
                        </td>
                    </tr>`;
            }
        }

        // Carga automática al abrir la página
        cargarLogs();
        // Consulta automática cada 5 segundos para simular tiempo real
        setInterval(cargarLogs, 5000);
    </script>
</body>
</html>
